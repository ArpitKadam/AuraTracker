plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.reelfetcher'
version = '1.0.0'

android {
  namespace "expo.modules.reelfetcher"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // Bundles Python + yt-dlp; ffmpeg module lets yt-dlp merge DASH video+audio.
  implementation "io.github.junkfood02.youtubedl-android:library:0.18.1"
  implementation "io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1"
}
